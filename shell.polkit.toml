# Replaces [polkit]: the password prompt. The darker scrim also gets blurred,
# which pushes the rest of the screen back while you authenticate.
[polkit]
background       = "#1a1b1e"
background-alpha = 0.45
text             = "#eaeaef"
text-error       = "#ef5d67"
border           = "hyprland.active-border"
border-error     = "#ef5d67"
border-alpha     = 1.0
scrim            = "#000000"
scrim-alpha      = 0.25
accent           = "#7ca5ff"
